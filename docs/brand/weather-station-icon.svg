<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Weather Station</title>
  <!-- Single source of the Weather Station emblem: brand/icon.png and
       icon@2x.png are rendered from it. -->
  <defs>
    <linearGradient id="ws-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a44"/>
      <stop offset="1" stop-color="#1c5a8a"/>
    </linearGradient>
    <linearGradient id="ws-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e6f5"/>
    </linearGradient>
    <linearGradient id="ws-drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdcff"/>
      <stop offset="1" stop-color="#2e8fd8"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#ws-bg)"/>
  <circle cx="178" cy="72" r="30" fill="#ffd166"/>
  <path d="M74 156c-22 0-38-16-38-36s16-36 37-36c7-24 29-40 55-40 30 0 55 22 58 52 18 2 32 17 32 35 0 14-9 25-22 25H74Z"
