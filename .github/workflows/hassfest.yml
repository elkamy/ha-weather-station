name: Hassfest

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Validate Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
